name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify mobile bundle
        shell: bash
        run: |
          node - <<'NODE'
          const { readFileSync } = require("fs");
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const main = readFileSync("main.js", "utf8");
          if (manifest.id !== "csvzall-mobile" || manifest.isDesktopOnly !== false) {
            throw new Error("manifest.json is not a mobile csvzall manifest.");
          }
          const banned = [
            /require\(["'](?:node:)?(?:child_process|crypto|electron|fs|fs\/promises|http|https|os|path|zlib|timers)["']\)/,
            /\bchild_process\b/,
            /\bfs\/promises\b/,
            /\bnode:/,
          ];
          for (const pattern of banned) {
            if (pattern.test(main)) {
              throw new Error(`main.js contains a desktop-only API marker: ${pattern}`);
            }
          }
          if (!main.includes("csvzall-mobile-embedded-wasm-viewer-v1")) {
            throw new Error("main.js is missing the embedded WASM viewer marker.");
          }
          if (readFileSync("mobile-src/main.ts", "utf8").includes("Platform.isMobileApp")) {
            throw new Error("The lightweight plugin must load on desktop and mobile.");
          }
          NODE
